<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単語×ローグライク RPG (Phase 2)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 画面シェイク */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake-effect { animation: shake 0.4s ease-in-out; }

        /* ダメージポップアップアニメーション */
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(10px) scale(0.8); }
            50% { opacity: 1; transform: translateY(-10px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-25px) scale(1); }
        }
        .damage-popup { animation: floatUp 0.8s forwards; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-3 select-none">

    <!-- ゲームコンテナ -->
    <div id="game-container" class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl p-4 border border-slate-700 relative overflow-hidden">
        
        <!-- ヘッダー情報 -->
        <div class="flex justify-between items-center mb-3 text-xs text-slate-400 font-bold px-1">
            <span id="floor-info" class="text-indigo-400">STAGE 1 (WAVE 1/10)</span>
            <span id="enemy-count">撃破数: 0</span>
        </div>

        <!-- ================= 対面型バトルエリア (ポケモン風) ================= -->
        <div id="battle-stage" class="bg-slate-950/80 rounded-xl p-3 border border-slate-700 relative mb-3">
            
            <!-- 演出用テキスト・ダメージポップアップ (オーバーレイ) -->
            <div id="cutin-overlay" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-20 hidden">
                <div id="cutin-text" class="text-3xl font-black text-yellow-400 drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)]">CRITICAL!!</div>
                <div id="damage-text" class="text-2xl font-bold text-white mt-1"></div>
            </div>

            <!-- 1. 上段：敵エリア -->
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-800">
                <!-- 敵ステータス -->
                <div class="w-1/2 pr-2">
                    <div id="enemy-name" class="font-bold text-sm text-rose-400">スライム</div>
                    <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden border border-slate-700 mt-1">
                        <div id="enemy-hp-bar" class="bg-rose-500 h-full transition-all duration-300" style="width: 100%;"></div>
                    </div>
                    <div class="text-[10px] text-slate-400 text-right mt-0.5"><span id="enemy-hp-current">80</span>/<span id="enemy-hp-max">80</span></div>
                </div>
                <!-- 敵画像 (ドット絵差し替え可能コンテナ) -->
                <div class="w-1/2 flex justify-center items-center">
                    <div id="enemy-sprite" class="text-5xl transform hover:scale-105 transition-transform">👾</div>
                </div>
            </div>

            <!-- 2. 下段：プレイヤーエリア -->
            <div class="flex items-center justify-between pt-1">
                <!-- プレイヤー画像 (ドット絵差し替え可能コンテナ) -->
                <div class="w-1/2 flex justify-center items-center">
                    <div id="player-sprite" class="text-5xl">⚔️</div>
                </div>
                <!-- プレイヤーステータス -->
                <div class="w-1/2 pl-2">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-sm text-emerald-400">あなた</span>
                        <!-- バリア表示 -->
                        <span id="barrier-badge" class="text-[11px] bg-cyan-900 text-cyan-300 px-1.5 py-0.5 rounded border border-cyan-500 font-mono">🛡️ 1</span>
                    </div>
                    <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden border border-slate-700 mt-1">
                        <div id="player-hp-bar" class="bg-emerald-500 h-full transition-all duration-300" style="width: 100%;"></div>
                    </div>
                    <div class="text-[10px] text-slate-400 text-right mt-0.5"><span id="player-hp-current">100</span>/<span id="player-hp-max">100</span></div>
                </div>
            </div>
        </div>

        <!-- ================= コントロール ＆ 出題エリア ================= -->
        <div id="question-panel" class="space-y-3">
            
            <!-- 自信度スライダー -->
            <div class="bg-slate-900/90 rounded-lg p-2 border border-slate-700 flex items-center justify-between text-xs">
                <span class="text-slate-400 font-bold flex items-center gap-1">
                    🔥 自信度倍率: <span id="confidence-val" class="text-yellow-400 font-mono font-bold text-sm">1.0x</span>
                </span>
                <input type="range" id="confidence-slider" min="10" max="20" value="10" step="1" 
                       class="w-28 accent-yellow-400 cursor-pointer" oninput="updateConfidence(this.value)">
            </div>

            <!-- 問題表示エリア (ダメージ期待値タグ表示) -->
            <div class="bg-slate-700/50 rounded-xl p-3 text-center border border-slate-600 relative">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-[10px] text-indigo-300 font-semibold uppercase">Question</span>
                    <!-- 価値連動ダメージ表示タグ -->
                    <span id="word-damage-badge" class="bg-rose-900/80 text-rose-300 text-[11px] font-bold px-2 py-0.5 rounded-full border border-rose-500/50">
                        想定威力: 35
                    </span>
                </div>
                <div id="question-text" class="text-2xl font-black text-white py-1">abandon</div>
                <div class="text-[11px] text-slate-400">正しい日本語を選択してください</div>
            </div>

            <!-- 4択選択肢 -->
            <div id="choices-container" class="grid grid-cols-1 gap-2">
                <!-- 動的生成 -->
            </div>
        </div>

        <!-- 解説モーダル (不正解時に一時停止用) -->
        <div id="explanation-modal" class="hidden absolute inset-0 bg-slate-950/90 z-30 p-6 flex flex-col justify-center items-center text-center">
            <div class="text-rose-400 text-sm font-bold mb-1">❌ Incorrect / 解説</div>
            <div id="exp-word" class="text-2xl font-bold text-white mb-1">abandon</div>
            <div id="exp-meaning" class="text-lg text-emerald-400 font-semibold mb-4">見捨てる、放棄する</div>
            <p class="text-xs text-slate-400 mb-6 leading-relaxed">この単語は復習が必要です。確実に覚えて次の攻撃力をアップさせましょう！</p>
            <button onclick="resumeAfterExplanation()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl transition">次へ進む</button>
        </div>

        <!-- ゲームオーバー画面 -->
        <div id="result-screen" class="hidden text-center py-8">
            <h2 class="text-3xl font-black mb-2 text-rose-500">GAME OVER</h2>
            <p class="text-slate-400 text-sm mb-6">ダンジョン攻略失敗……</p>
            <button onclick="restartGame()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl shadow-lg transition">もう一度挑戦</button>
        </div>

    </div>

    <script>
        // --- 1. マスター＆単語データ ---
        let words = [
            { id: 1, en: "abandon", ja: "見捨てる、放棄する", correctCount: 0, incorrectCount: 0, lastResult: null, lastSeenTime: null },
            { id: 2, en: "ability", ja: "能力、才能", correctCount: 0, incorrectCount: 0, lastResult: null, lastSeenTime: null },
            { id: 3, en: "abolish", ja: "廃止する", correctCount: 0, incorrectCount: 0, lastResult: null, lastSeenTime: null },
            { id: 4, en: "absent", ja: "不在の、欠席した", correctCount: 0, incorrectCount: 0, lastResult: null, lastSeenTime: null },
            { id: 5, en: "absolute", ja: "絶対的な、完全な", correctCount: 0, incorrectCount: 0, lastResult: null, lastSeenTime: null },
            { id: 6, en: "absorb", ja: "吸収する、夢中にさせる", correctCount: 0, incorrectCount: 0, lastResult: null, lastSeenTime: null },
            { id: 7, en: "abstract", ja: "抽象的な", correctCount: 0, incorrectCount: 0, lastResult: null, lastSeenTime: null },
            { id: 8, en: "absurd", ja: "ばかげた、不条理な", correctCount: 0, incorrectCount: 0, lastResult: null, lastSeenTime: null }
        ];

        // --- 2. 状態管理 ---
        let player = { hp: 100, maxHp: 100, barrier: 1, defeatedCount: 0 };
        let currentEnemy = { name: "スライム", icon: "👾", hp: 80, maxHp: 80 };
        let currentWord = null;
        let confidenceMultiplier = 1.0;
        let questionStartTime = 0;
        let isProcessing = false; // 二重タップ防止

        // --- 3. ダメージ計算ロジック（価値連動） ---
        function calcWordBaseDamage(word) {
            let dmg = 15;
            if (word.lastSeenTime === null) dmg += 25;       // 初見 (+25)
            else if (word.lastResult === false) dmg += 20;   // 直近ミス (+20)
            else dmg += 5;                                  // 復習 (+5)
            dmg += Math.min(word.incorrectCount * 2, 10);
            return dmg;
        }

        // --- 4. ゲーム初期化 ---
        function initGame() {
            player.hp = 100;
            player.barrier = 1;
            player.defeatedCount = 0;
            spawnEnemy();
            updateUI();
            nextQuestion();
        }

        function spawnEnemy() {
            const types = [
                { name: "スライム", icon: "👾", hp: 70 },
                { name: "ゴブリン", icon: "👺", hp: 100 },
                { name: "スケルトン", icon: "💀", hp: 130 }
            ];
            const wave = (player.defeatedCount % 10) + 1;
            if (wave === 10) {
                currentEnemy = { name: "忘却の魔王 (BOSS)", icon: "👑", hp: 250, maxHp: 250 };
            } else {
                const t = types[Math.floor(Math.random() * types.length)];
                currentEnemy = { name: t.name, icon: t.icon, hp: t.hp, maxHp: t.hp };
            }
        }

        // --- 5. 出題と選択肢生成 ---
        function nextQuestion() {
            isProcessing = false;
            document.getElementById('cutin-overlay').classList.add('hidden');

            // 未出題・高価値な単語を優先して選出
            const sorted = [...words].sort((a, b) => calcWordBaseDamage(b) - calcWordBaseDamage(a));
            currentWord = sorted[Math.floor(Math.random() * Math.min(3, sorted.length))];

            // UI更新 (問題と価値タグ)
            document.getElementById('question-text').textContent = currentWord.en;
            const baseDmg = calcWordBaseDamage(currentWord);
            document.getElementById('word-damage-badge').textContent = `想定威力: ${baseDmg}`;

            // 4択生成
            let choices = [currentWord.ja];
            while (choices.length < 4) {
                let dummy = words[Math.floor(Math.random() * words.length)].ja;
                if (!choices.includes(dummy)) choices.push(dummy);
            }
            choices.sort(() => Math.random() - 0.5);

            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            choices.forEach(text => {
                const btn = document.createElement('button');
                btn.className = "w-full py-2.5 px-4 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 rounded-xl font-medium text-left transition border border-slate-600 text-sm flex justify-between items-center";
                btn.innerHTML = `<span>${text}</span>`;
                btn.onclick = () => handleAnswer(text, btn);
                container.appendChild(btn);
            });

            // 回答開始時間を記録（1秒以内クリティカル用）
            questionStartTime = Date.now();
        }

        function updateConfidence(val) {
            confidenceMultiplier = (parseFloat(val) / 10).toFixed(1);
            document.getElementById('confidence-val').textContent = `${confidenceMultiplier}x`;
        }

        // --- 6. シーケンス制御（タイムライン分離） ---
        function handleAnswer(selectedText, btnElement) {
            if (isProcessing) return;
            isProcessing = true;

            const responseTime = (Date.now() - questionStartTime) / 1000;
            const isCritical = (responseTime <= 1.0);
            const isCorrect = (selectedText === currentWord.ja);

            // 全ボタン無効化
            const container = document.getElementById('choices-container');
            Array.from(container.children).forEach(b => b.disabled = true);

            // [シーケンス 1] 判定演出 (0.3秒)
            if (isCorrect) {
                btnElement.classList.replace('bg-slate-700', 'bg-emerald-600');
                currentWord.correctCount++;
                currentWord.lastResult = true;
                currentWord.lastSeenTime = Date.now();

                // 計算
                let finalDmg = Math.round(calcWordBaseDamage(currentWord) * confidenceMultiplier * (isCritical ? 1.5 : 1.0));
                
                setTimeout(() => {
                    // [シーケンス 2] アクション演出 (0.5秒)
                    showCutin(isCritical ? "CRITICAL!!" : "GREAT!", `💥 ${finalDmg} Damage`, "text-yellow-400");
                    currentEnemy.hp = Math.max(0, currentEnemy.hp - finalDmg);
                    updateUI();

                    setTimeout(() => {
                        // [シーケンス 3] 遷移判定
                        if (currentEnemy.hp <= 0) {
                            player.defeatedCount++;
                            spawnEnemy();
                            updateUI();
                        }
                        nextQuestion();
                    }, 600);
                }, 300);

            } else {
                btnElement.classList.replace('bg-slate-700', 'bg-rose-600');
                currentWord.incorrectCount++;
                currentWord.lastResult = false;
                currentWord.lastSeenTime = Date.now();

                setTimeout(() => {
                    // [シーケンス 2] ダメージ / バリア消費演出
                    if (player.barrier > 0) {
                        player.barrier--;
                        showCutin("GUARD!", "🛡️ バリアが攻撃を防いだ", "text-cyan-400");
                    } else {
                        let penaltyDmg = Math.round(20 * confidenceMultiplier);
                        player.hp = Math.max(0, player.hp - penaltyDmg);
                        showCutin("MISS...", `💔 -${penaltyDmg} HP`, "text-rose-500");
                        document.getElementById('game-container').classList.add('shake-effect');
                        setTimeout(() => document.getElementById('game-container').classList.remove('shake-effect'), 400);
                    }
                    updateUI();

                    setTimeout(() => {
                        // [シーケンス 3] ゲームオーバー or 不正解解説モーダル表示
                        if (player.hp <= 0) {
                            showGameOver();
                        } else {
                            // 不正解時は自動進行せず、プレイヤーが確認するまで停止
                            document.getElementById('exp-word').textContent = currentWord.en;
                            document.getElementById('exp-meaning').textContent = currentWord.ja;
                            document.getElementById('explanation-modal').classList.remove('hidden');
                        }
                    }, 700);
                }, 300);
            }
        }

        // カットイン表示
        function showCutin(title, sub, colorClass) {
            const overlay = document.getElementById('cutin-overlay');
            const titleEl = document.getElementById('cutin-text');
            const subEl = document.getElementById('damage-text');
            
            titleEl.textContent = title;
            titleEl.className = `text-3xl font-black ${colorClass} drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)]`;
            subEl.textContent = sub;
            
            overlay.classList.remove('hidden');
        }

        // 解説を見て次へ
        function resumeAfterExplanation() {
            document.getElementById('explanation-modal').classList.add('hidden');
            nextQuestion();
        }

        // --- 7. UI更新 ---
        function updateUI() {
            document.getElementById('enemy-hp-current').textContent = currentEnemy.hp;
            document.getElementById('enemy-hp-max').textContent = currentEnemy.maxHp;
            document.getElementById('enemy-hp-bar').style.width = `${(currentEnemy.hp / currentEnemy.maxHp) * 100}%`;
            document.getElementById('enemy-name').textContent = currentEnemy.name;
            document.getElementById('enemy-sprite').textContent = currentEnemy.icon;

            document.getElementById('player-hp-current').textContent = player.hp;
            document.getElementById('player-hp-max').textContent = player.maxHp;
            document.getElementById('player-hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
            document.getElementById('barrier-badge').textContent = `🛡️ ${player.barrier}`;

            const wave = (player.defeatedCount % 10) + 1;
            document.getElementById('floor-info').textContent = `STAGE 1 (WAVE ${wave}/10)`;
            document.getElementById('enemy-count').textContent = `撃破数: ${player.defeatedCount}`;
        }

        function showGameOver() {
            document.getElementById('question-panel').classList.add('hidden');
            document.getElementById('battle-stage').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
        }

        function restartGame() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('battle-stage').classList.remove('hidden');
            document.getElementById('question-panel').classList.remove('hidden');
            initGame();
        }

        // 起動
        initGame();
    </script>
</body>
</html>
